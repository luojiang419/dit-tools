<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据检索</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("websearch-theme") || "light";
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换到暗黑模式" title="切换到暗黑模式">
    <svg id="themeMoon" class="theme-icon" aria-hidden="true" viewBox="0 0 24 24">
      <path d="M20.4 15.5A8.4 8.4 0 0 1 8.5 3.6 8.5 8.5 0 1 0 20.4 15.5Z"/>
    </svg>
    <svg id="themeSun" class="theme-icon" aria-hidden="true" viewBox="0 0 24 24" hidden>
      <circle cx="12" cy="12" r="3.5"/>
      <path d="M12 2.5v2M12 19.5v2M4.58 4.58l1.42 1.42M18 18l1.42 1.42M2.5 12h2M19.5 12h2M4.58 19.42 6 18M18 6l1.42-1.42"/>
    </svg>
  </button>
  <main class="search-shell" aria-label="素材搜索">
    <section id="resultPanel" class="result-panel" hidden>
      <div id="resultMeta" class="result-meta"></div>
      <div id="resultList" class="result-list"></div>
    </section>
    <form id="searchForm" class="search-form" role="search">
      <label class="visually-hidden" for="searchInput">搜索素材</label>
      <div class="search-box">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="m21 21-4.3-4.3m1.3-5.2a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/>
        </svg>
        <input id="searchInput" name="q" type="search" autocomplete="off" spellcheck="false" placeholder="搜索素材...">
        <button id="clearButton" class="clear-button" type="button" aria-label="清除搜索" title="清除搜索" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m7 7 10 10M17 7 7 17"/>
          </svg>
        </button>
      </div>
    </form>
  </main>
  <section id="detailModal" class="detail-modal" hidden aria-labelledby="detailTitle">
    <div class="detail-backdrop" data-detail-close></div>
    <article class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1">
      <header class="detail-header">
        <div class="detail-heading">
          <span class="detail-eyebrow">逐帧视觉分析</span>
          <h2 id="detailTitle">素材分析结果</h2>
          <p id="detailSubtitle">正在加载素材详情...</p>
        </div>
        <div class="detail-header-actions">
          <span id="detailStatus" class="detail-status">读取中</span>
          <button id="detailClose" class="detail-close" type="button" data-detail-close aria-label="关闭逐帧分析" title="关闭（Esc）">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
            <span>关闭</span>
            <kbd>Esc</kbd>
          </button>
        </div>
      </header>
      <div id="detailLoading" class="detail-loading" hidden>
        <span class="loading-orbit" aria-hidden="true"></span>
        <strong>正在整理逐帧分析结果</strong>
        <span>从本机索引读取画面、字幕与视觉标签…</span>
      </div>
      <div id="detailBody" class="detail-body" hidden>
        <aside class="frame-rail" aria-label="逐帧结果列表">
          <div class="frame-rail-header">
            <div><span class="panel-eyebrow">Frame log</span><strong>画面序列</strong></div>
            <span id="frameCount" class="frame-count">0 帧</span>
          </div>
          <div id="frameList" class="frame-list"></div>
        </aside>
        <section class="frame-stage" aria-live="polite">
          <div id="stageImage" class="stage-image"></div>
          <div class="stage-footer">
            <div>
              <span id="stageFrameLabel" class="stage-frame-label">第 0 帧</span>
              <strong id="stageTimestamp">00:00</strong>
            </div>
            <span id="stageState" class="stage-state">未选择</span>
          </div>
          <p id="stageCaption" class="stage-caption">选择左侧画面查看该帧的分析结果。</p>
        </section>
        <aside class="analysis-panel" aria-label="当前帧分析详情">
          <div class="analysis-panel-header"><span class="panel-eyebrow">Frame insight</span><span id="analysisModel" class="analysis-model">本地索引</span></div>
          <section class="analysis-section"><span class="analysis-label">内容摘要</span><p id="analysisSummary" class="analysis-summary">—</p></section>
          <section class="analysis-section"><span class="analysis-label">视觉标签</span><div id="analysisTags" class="analysis-chips"></div></section>
          <section class="analysis-section"><span class="analysis-label">识别对象</span><div id="analysisObjects" class="analysis-chips"></div></section>
          <section class="analysis-section analysis-section--compact"><span class="analysis-label">场景与动作</span><p id="analysisContext" class="analysis-context">—</p></section>
          <section class="analysis-section analysis-section--compact"><span class="analysis-label">OCR 文字</span><p id="analysisOcr" class="analysis-context">—</p></section>
          <div id="analysisMeta" class="analysis-meta"></div>
        </aside>
      </div>
      <div id="detailEmpty" class="detail-empty" hidden>
        <strong>暂无逐帧分析结果</strong>
        <span>该素材已被检索到，但还没有可展示的画面分析帧。</span>
      </div>
    </article>
  </section>
  <script src="/app.js" defer></script>
</body>
</html>
